# Decap CMS（原 Netlify CMS）— 编辑 content/posts.json 后提交到 Git 即可更新站点。
# 站点：https://renhsssdjksgkjh.github.io/my-blog/ （GitHub Pages 项目页，带仓库名子路径）
# 若站点托管在 Netlify 并启用 Identity + Git Gateway，可将 name 改为 git-gateway。
#
# 本地联调（可选）：安装 decap-server 后在本仓库根目录运行 npx decap-server，
# 并取消下面 local_backend 的注释；同时把 backend 临时改为 test-repo 仅作界面演示。

site_url: https://renhsssdjksgkjh.github.io/my-blog

backend:
  name: github
  repo: renhsssdjksgkjh/my-blog
  branch: main

# local_backend: true

media_folder: "content/uploads"
# 与 GitHub Pages 项目站点的子路径一致，CMS 上传的图片链接才会正确
public_folder: "/my-blog/content/uploads"

collections:
  - name: "blog"
    label: "博客"
    files:
      - name: "posts_json"
        label: "所有文章（JSON）"
        file: "content/posts.json"
        format: "json"
        fields:
          - label: "文章列表"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}} — {{fields.slug}}"
            fields:
              - { label: "Slug（网址标识，唯一）", name: "slug", widget: "string", hint: "建议英文或拼音，如 my-first-post" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "发布日期", name: "date", widget: "string", hint: "格式 YYYY-MM-DD" }
              - { label: "摘要", name: "excerpt", widget: "text" }
              - label: "标签"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "标签", name: "tag", widget: "string" }
              - {
                  label: "正文（HTML）",
                  name: "contentHtml",
                  widget: "text",
                  hint: "段落用 <p>，小标题用 <h2>/<h3>，勿粘贴不可信来源的脚本。",
                }
