<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="个人博客 — 技术、设计与日常思考" />
    <title>墨迹 · 个人博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Archivo", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="min-h-screen bg-zinc-50 font-sans text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <a href="#main" class="skip-link">跳到正文</a>

    <header class="fixed left-4 right-4 top-4 z-50 mx-auto max-w-5xl">
      <div
        class="ui-header-in flex items-center justify-between gap-4 rounded-2xl border border-zinc-200/90 bg-white/90 px-4 py-3 shadow-sm backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/90"
      >
        <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">
          墨迹
        </a>
        <nav class="hidden items-center gap-6 text-sm font-medium text-zinc-600 md:flex dark:text-zinc-300">
          <a href="index.html#posts" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400"
            >文章</a
          >
          <a href="about.html" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400"
            >关于</a
          >
          <a href="login.html" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">后台</a>
        </nav>
        <div class="flex items-center gap-2">
          <button
            type="button"
            id="theme-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800 dark:hover:text-white"
            aria-label="切换浅色或深色主题"
          >
            <svg id="icon-sun" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
              />
            </svg>
            <svg id="icon-moon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </button>
          <button
            type="button"
            id="nav-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 md:hidden dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800"
            aria-expanded="false"
            aria-controls="mobile-nav"
            aria-label="打开菜单"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div
        id="mobile-nav"
        class="mt-2 hidden rounded-2xl border border-zinc-200/90 bg-white/95 p-3 shadow-lg backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/95 md:hidden"
      >
        <nav class="flex flex-col gap-1 text-sm font-medium">
          <a
            href="index.html#posts"
            class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800"
            >文章</a
          >
          <a
            href="about.html"
            class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800"
            >关于</a
          >
          <a href="login.html" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">后台</a>
        </nav>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-5xl px-4 pb-20 pt-28 md:pt-32">
      <section class="rounded-3xl border border-zinc-200/80 bg-gradient-to-br from-white via-white to-zinc-50 px-6 py-14 shadow-sm dark:border-zinc-800 dark:from-zinc-900 dark:via-zinc-900 dark:to-zinc-950 md:px-12 md:py-16">
        <p class="ui-fade-up ui-delay-1 text-sm font-medium uppercase tracking-widest text-blue-600 dark:text-blue-400">Personal blog</p>
        <h1 id="site-title" class="ui-fade-up ui-delay-2 mt-3 font-display text-4xl font-bold tracking-tight text-zinc-950 md:text-5xl dark:text-white">
          墨迹
        </h1>
        <p id="site-tagline" class="ui-fade-up ui-delay-3 mt-4 max-w-2xl text-lg leading-relaxed text-zinc-600 dark:text-zinc-400"></p>
        <div class="ui-fade-up ui-delay-4 mt-8 flex flex-wrap gap-3">
          <a
            href="#posts"
            class="inline-flex cursor-pointer items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors duration-200 ease-out hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-zinc-950"
            >阅读文章</a
          >
          <a
            href="about.html"
            class="inline-flex cursor-pointer items-center justify-center rounded-xl border border-zinc-300 bg-white/80 px-5 py-2.5 text-sm font-semibold text-zinc-800 transition-colors duration-200 ease-out hover:border-zinc-400 hover:bg-white dark:border-zinc-700 dark:bg-zinc-900/80 dark:text-zinc-100 dark:hover:border-zinc-500"
            >关于我</a
          >
        </div>
      </section>

      <section id="posts" class="ui-fade-up ui-delay-5 mt-16 scroll-mt-28">
        <div class="flex items-end justify-between gap-4 border-b border-zinc-200 pb-4 dark:border-zinc-800">
          <h2 class="font-display text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">最新文章</h2>
          <span class="text-sm text-zinc-500 dark:text-zinc-400">按日期倒序</span>
        </div>
        <ul id="post-list" class="mt-8 grid gap-5 md:grid-cols-2"></ul>
      </section>
    </main>
    <footer class="ui-fade-up ui-delay-6 mx-auto max-w-5xl border-t border-zinc-200 px-4 py-10 text-sm text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      <div class="flex flex-col items-start justify-between gap-6 sm:flex-row sm:items-center">
        <p>© <span id="year"></span> 墨迹 · 个人博客</p>
        <div class="flex items-center gap-4">
          <a
            href="https://github.com"
            class="cursor-pointer text-zinc-500 transition-colors duration-200 hover:text-zinc-800 dark:hover:text-zinc-200"
            aria-label="GitHub"
            rel="noopener noreferrer"
            target="_blank"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
          </a>
        </div>
      </div>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/posts-store.js"></script>
    <script src="js/ripple.js"></script>
    <script>
      window.loadBlogPosts().then(function () {
        var s = document.createElement("script");
        s.src = "js/home.js";
        document.body.appendChild(s);
      });
    </script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      (function () {
        var root = document.documentElement;
        var sun = document.getElementById("icon-sun");
        var moon = document.getElementById("icon-moon");
        var btn = document.getElementById("theme-toggle");

        function syncIcons() {
          var dark = root.classList.contains("dark");
          if (sun && moon) {
            sun.classList.toggle("hidden", !dark);
            moon.classList.toggle("hidden", dark);
          }
          if (btn) btn.setAttribute("aria-label", dark ? "切换到浅色主题" : "切换到深色主题");
        }
        syncIcons();

        if (btn) {
          btn.addEventListener("click", function () {
            window.toggleTheme();
            syncIcons();
          });
        }

        var navBtn = document.getElementById("nav-toggle");
        var mobileNav = document.getElementById("mobile-nav");
        if (navBtn && mobileNav) {
          navBtn.addEventListener("click", function () {
            var open = mobileNav.classList.toggle("hidden") === false;
            navBtn.setAttribute("aria-expanded", open ? "true" : "false");
            navBtn.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
          });
        }
      })();
    </script>
  </body>
</html>
