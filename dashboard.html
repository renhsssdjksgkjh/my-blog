<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="后台管理 — 墨迹博客" />
    <title>后台管理 · 墨迹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Archivo", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="min-h-screen bg-zinc-50 font-sans text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <a href="#main" class="skip-link">跳到正文</a>

    <header class="fixed left-4 right-4 top-4 z-50 mx-auto max-w-5xl">
      <div
        class="ui-header-in flex items-center justify-between gap-4 rounded-2xl border border-zinc-200/90 bg-white/90 px-4 py-3 shadow-sm backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/90"
      >
        <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">墨迹</a>
        <nav class="hidden items-center gap-6 text-sm font-medium text-zinc-600 md:flex dark:text-zinc-300" aria-label="主导航">
          <a href="index.html#posts" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">文章</a>
          <a href="about.html" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">关于</a>
          <a href="dashboard.html" class="cursor-pointer rounded-lg px-2 py-1 text-blue-600 dark:text-blue-400" aria-current="page">后台</a>
        </nav>
        <div class="flex items-center gap-2">
          <button
            type="button"
            id="admin-btn-logout"
            class="hidden cursor-pointer rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 transition-colors duration-200 hover:bg-zinc-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700 md:inline-flex md:items-center"
          >
            退出登录
          </button>
          <button
            type="button"
            id="theme-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800 dark:hover:text-white"
            aria-label="切换浅色或深色主题"
          >
            <svg id="icon-sun" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
              />
            </svg>
            <svg id="icon-moon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </button>
          <button
            type="button"
            id="nav-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 md:hidden dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800"
            aria-expanded="false"
            aria-controls="mobile-nav"
            aria-label="打开菜单"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div
        id="mobile-nav"
        class="mt-2 hidden rounded-2xl border border-zinc-200/90 bg-white/95 p-3 shadow-lg backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/95 md:hidden"
      >
        <nav class="flex flex-col gap-1 text-sm font-medium">
          <a href="index.html#posts" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">文章</a>
          <a href="about.html" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">关于</a>
          <a href="dashboard.html" class="cursor-pointer rounded-lg px-3 py-2 text-blue-600 dark:text-blue-400" aria-current="page">后台</a>
          <button
            type="button"
            id="admin-btn-logout-mobile"
            class="w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800"
          >
            退出登录
          </button>
        </nav>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-5xl px-4 pb-24 pt-28 md:pt-32">
      <div class="rounded-2xl border border-zinc-200/90 bg-white px-5 py-8 shadow-sm dark:border-zinc-800 dark:bg-zinc-900/80 md:px-8 md:py-10">
        <div class="flex flex-col gap-4 border-b border-zinc-200 pb-6 dark:border-zinc-800 md:flex-row md:items-end md:justify-between">
          <div>
            <h1 class="font-display text-2xl font-bold tracking-tight text-zinc-950 md:text-3xl dark:text-white">后台管理</h1>
            <p class="mt-2 max-w-2xl text-sm leading-relaxed text-zinc-600 dark:text-zinc-400">
              文章默认由仓库根目录 <strong class="font-medium text-zinc-800 dark:text-zinc-200">content/posts.json</strong> 提供，可用
              <a href="admin/index.html" class="font-medium text-blue-600 underline decoration-blue-600/30 underline-offset-2 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">Decap CMS</a>
              可视化编辑（需配置 Git 后端）。若 JSON 无法加载，则回退到本机 <strong class="font-medium text-zinc-800 dark:text-zinc-200">localStorage</strong> 或
              <strong class="font-medium text-zinc-800 dark:text-zinc-200">js/posts.js</strong> 内置示例。请用本地静态服务器打开站点以便读取 JSON。
            </p>
          </div>
          <a
            href="index.html"
            class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-xl border border-zinc-300 bg-white px-4 py-2 text-sm font-semibold text-zinc-800 transition-colors duration-200 hover:border-zinc-400 hover:bg-zinc-50 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:border-zinc-500"
            >返回前台</a
          >
        </div>

        <div id="admin-status" class="mt-6 hidden" role="status" aria-live="polite"></div>

        <div class="mt-8 flex flex-wrap gap-2 border-b border-zinc-200 pb-6 dark:border-zinc-800">
          <button
            type="button"
            id="admin-btn-export"
            class="cursor-pointer rounded-xl border border-zinc-300 bg-white px-4 py-2 text-sm font-semibold text-zinc-800 transition-colors duration-200 hover:bg-zinc-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700"
          >
            导出 JSON
          </button>
          <label
            class="inline-flex cursor-pointer items-center justify-center rounded-xl border border-zinc-300 bg-white px-4 py-2 text-sm font-semibold text-zinc-800 transition-colors duration-200 hover:bg-zinc-50 focus-within:ring-2 focus-within:ring-blue-500 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700"
          >
            <span>导入 JSON</span>
            <input id="admin-import-file" type="file" accept="application/json,.json" class="sr-only" />
          </label>
          <button
            type="button"
            id="admin-btn-reset-seed"
            class="cursor-pointer rounded-xl border border-amber-300 bg-amber-50 px-4 py-2 text-sm font-semibold text-amber-900 transition-colors duration-200 hover:bg-amber-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 dark:border-amber-800 dark:bg-amber-950/50 dark:text-amber-100 dark:hover:bg-amber-900/40"
          >
            恢复内置示例
          </button>
        </div>

        <div class="mt-10 grid gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]">
          <div>
            <h2 class="font-display text-lg font-semibold text-zinc-900 dark:text-zinc-50">文章列表</h2>
            <ul id="admin-post-list" class="mt-4 flex list-none flex-col gap-2 p-0"></ul>
          </div>

          <div>
            <h2 class="font-display text-lg font-semibold text-zinc-900 dark:text-zinc-50">新建 / 编辑</h2>
            <form id="admin-post-form" class="mt-4 flex flex-col gap-4">
              <div>
                <label for="slug" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">slug（网址标识）</label>
                <input
                  id="slug"
                  name="slug"
                  type="text"
                  autocomplete="off"
                  class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                  placeholder="例如 my-first-post"
                />
                <p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">编辑时 slug 锁定；仅字母、数字、中文与连字符会保留。</p>
              </div>
              <div>
                <label for="title" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">标题</label>
                <input
                  id="title"
                  name="title"
                  type="text"
                  required
                  class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                />
              </div>
              <div>
                <label for="date" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">日期</label>
                <input
                  id="date"
                  name="date"
                  type="date"
                  required
                  class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                />
              </div>
              <div>
                <label for="tags" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">标签</label>
                <input
                  id="tags"
                  name="tags"
                  type="text"
                  class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                  placeholder="逗号分隔，例如 前端, 随笔"
                />
              </div>
              <div>
                <label for="excerpt" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">摘要</label>
                <textarea
                  id="excerpt"
                  name="excerpt"
                  rows="2"
                  class="w-full resize-y rounded-xl border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                ></textarea>
              </div>
              <div>
                <label for="contentHtml" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">正文（HTML）</label>
                <textarea
                  id="contentHtml"
                  name="contentHtml"
                  rows="14"
                  class="w-full resize-y rounded-xl border border-zinc-300 bg-white px-3 py-2.5 font-mono text-sm text-zinc-900 outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-50 dark:focus:border-blue-400"
                  placeholder="<p>段落</p><h2>小标题</h2>"
                ></textarea>
              </div>
              <div class="flex flex-wrap gap-3">
                <button
                  type="submit"
                  class="cursor-pointer rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors duration-200 hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                >
                  保存
                </button>
                <button
                  type="button"
                  id="admin-btn-new"
                  class="cursor-pointer rounded-xl border border-zinc-300 bg-white px-5 py-2.5 text-sm font-semibold text-zinc-800 transition-colors duration-200 hover:bg-zinc-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700"
                >
                  清空表单（新建）
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="mx-auto max-w-5xl border-t border-zinc-200 px-4 py-10 text-sm text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      <p>© <span id="year"></span> 墨迹 · 后台</p>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/posts-store.js"></script>
    <script src="js/auth.js"></script>
    <script>
      window.loadBlogPosts().then(function () {
        var s = document.createElement("script");
        s.src = "js/dashboard.js";
        document.body.appendChild(s);
      });
    </script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      (function () {
        var root = document.documentElement;
        var sun = document.getElementById("icon-sun");
        var moon = document.getElementById("icon-moon");
        var btn = document.getElementById("theme-toggle");
        function syncIcons() {
          var dark = root.classList.contains("dark");
          if (sun && moon) {
            sun.classList.toggle("hidden", !dark);
            moon.classList.toggle("hidden", dark);
          }
          if (btn) btn.setAttribute("aria-label", dark ? "切换到浅色主题" : "切换到深色主题");
        }
        syncIcons();
        if (btn) {
          btn.addEventListener("click", function () {
            window.toggleTheme();
            syncIcons();
          });
        }
        var navBtn = document.getElementById("nav-toggle");
        var mobileNav = document.getElementById("mobile-nav");
        if (navBtn && mobileNav) {
          navBtn.addEventListener("click", function () {
            var open = mobileNav.classList.toggle("hidden") === false;
            navBtn.setAttribute("aria-expanded", open ? "true" : "false");
            navBtn.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
          });
        }
      })();
    </script>
  </body>
</html>
