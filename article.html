<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="文章详情" />
    <title>文章 · 墨迹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Archivo", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="min-h-screen bg-zinc-50 font-sans text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <a href="#main" class="skip-link">跳到正文</a>

    <header class="fixed left-4 right-4 top-4 z-50 mx-auto max-w-7xl">
      <div
        class="ui-header-in flex items-center justify-between gap-4 rounded-2xl border border-zinc-200/90 bg-white/90 px-4 py-3 shadow-sm backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/90"
      >
        <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">墨迹</a>
        <nav class="hidden items-center gap-6 text-sm font-medium text-zinc-600 md:flex dark:text-zinc-300">
          <a href="index.html#posts" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">文章</a>
          <a href="about.html" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">关于</a>
          <a href="login.html" class="cursor-pointer rounded-lg px-2 py-1 transition-colors duration-200 hover:text-blue-600 dark:hover:text-blue-400">后台</a>
        </nav>
        <div class="flex items-center gap-2">
          <button
            type="button"
            id="theme-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800 dark:hover:text-white"
            aria-label="切换浅色或深色主题"
          >
            <svg id="icon-sun" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
              />
            </svg>
            <svg id="icon-moon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </button>
          <button
            type="button"
            id="nav-toggle"
            class="cursor-pointer rounded-lg border border-transparent p-2 text-zinc-600 transition-colors duration-200 hover:border-zinc-200 hover:bg-zinc-50 md:hidden dark:text-zinc-300 dark:hover:border-zinc-700 dark:hover:bg-zinc-800"
            aria-expanded="false"
            aria-controls="mobile-nav"
            aria-label="打开菜单"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div
        id="mobile-nav"
        class="mt-2 hidden rounded-2xl border border-zinc-200/90 bg-white/95 p-3 shadow-lg backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-900/95 md:hidden"
      >
        <nav class="flex flex-col gap-1 text-sm font-medium">
          <a href="index.html#posts" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">文章</a>
          <a href="about.html" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">关于</a>
          <a href="login.html" class="cursor-pointer rounded-lg px-3 py-2 text-zinc-700 transition-colors hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">后台</a>
        </nav>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-7xl px-4 pb-24 pt-28 md:pt-32">
      <div id="article-missing" class="hidden rounded-2xl border border-zinc-200 bg-white p-10 text-center dark:border-zinc-800 dark:bg-zinc-900">
        <h1 class="font-display text-2xl font-semibold text-zinc-900 dark:text-zinc-50">未找到这篇文章</h1>
        <p class="mt-2 text-zinc-600 dark:text-zinc-400">链接可能过期，或地址有误。</p>
        <a
          href="index.html"
          class="mt-6 inline-flex cursor-pointer items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors duration-200 hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          >返回首页</a
        >
      </div>

      <div id="article-doc-shell" class="hidden">
        <div class="ui-fade-up space-y-4 lg:hidden">
          <details class="doc-mobile-panel group rounded-xl border border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 px-4 py-3 text-sm font-semibold text-zinc-900 outline-none transition-colors hover:bg-zinc-50 dark:text-zinc-100 dark:hover:bg-zinc-800 [&::-webkit-details-marker]:hidden"
            >
              <span>文章</span>
              <svg class="h-4 w-4 shrink-0 text-zinc-500 transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </summary>
            <nav id="article-nav-mobile" class="border-t border-zinc-200 px-2 py-2 dark:border-zinc-800" aria-label="文章列表"></nav>
          </details>
          <details class="doc-mobile-panel group rounded-xl border border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 px-4 py-3 text-sm font-semibold text-zinc-900 outline-none transition-colors hover:bg-zinc-50 dark:text-zinc-100 dark:hover:bg-zinc-800 [&::-webkit-details-marker]:hidden"
            >
              <span>目录</span>
              <svg class="h-4 w-4 shrink-0 text-zinc-500 transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </summary>
            <nav id="article-toc-mobile" class="border-t border-zinc-200 px-2 py-3 dark:border-zinc-800" aria-label="本页目录"></nav>
          </details>
        </div>

        <div class="lg:grid lg:grid-cols-[minmax(0,220px)_minmax(0,1fr)_minmax(0,200px)] lg:items-start lg:gap-10 xl:gap-14">
          <aside
            class="ui-fade-up ui-delay-1 sticky-doc-nav hidden min-h-0 w-full shrink-0 border-r border-zinc-200 pr-6 dark:border-zinc-800 lg:block"
            aria-label="文章列表"
          >
            <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">文章</p>
            <nav id="article-nav-desktop" class="doc-side-nav space-y-0.5 text-sm"></nav>
          </aside>

          <article id="article-main" class="ui-fade-up ui-delay-2 min-w-0 border-zinc-200 bg-transparent px-4 py-6 dark:border-zinc-800 dark:bg-transparent sm:px-6 lg:rounded-xl lg:border lg:bg-white lg:px-10 lg:py-10 lg:shadow-sm lg:dark:border-zinc-800 lg:dark:bg-zinc-900/80">
            <a
              href="index.html#posts"
              class="inline-flex cursor-pointer items-center gap-1 text-sm font-medium text-blue-600 transition-colors duration-200 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
              返回文章列表
            </a>
            <header class="mt-6 border-b border-zinc-200 pb-8 dark:border-zinc-800">
              <div id="article-tags" class="flex flex-wrap gap-2"></div>
              <h1 id="article-title" class="mt-4 font-display text-3xl font-bold tracking-tight text-zinc-950 md:text-4xl dark:text-white"></h1>
              <p class="mt-3 text-sm text-zinc-500 dark:text-zinc-400">
                发布于 <time id="article-date" datetime=""></time>
              </p>
            </header>
            <div id="article-body" class="prose-article mt-10 max-w-[65ch]"></div>
          </article>

          <aside
            class="ui-fade-up ui-delay-3 sticky-doc-toc hidden min-h-0 w-full shrink-0 border-l border-zinc-200 pl-6 dark:border-zinc-800 lg:block"
            aria-label="本页目录"
          >
            <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">目录</p>
            <nav id="article-toc-desktop" class="doc-toc text-sm"></nav>
          </aside>
        </div>
      </div>
    </main>

    <footer class="ui-fade-up ui-delay-4 mx-auto max-w-7xl border-t border-zinc-200 px-4 py-10 text-sm text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      <p>© <span id="year"></span> 墨迹</p>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/posts-store.js"></script>
    <script src="js/ripple.js"></script>
    <script>
      window.loadBlogPosts().then(function () {
        var s = document.createElement("script");
        s.src = "js/article.js";
        document.body.appendChild(s);
      });
    </script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      (function () {
        var root = document.documentElement;
        var sun = document.getElementById("icon-sun");
        var moon = document.getElementById("icon-moon");
        var btn = document.getElementById("theme-toggle");
        function syncIcons() {
          var dark = root.classList.contains("dark");
          if (sun && moon) {
            sun.classList.toggle("hidden", !dark);
            moon.classList.toggle("hidden", dark);
          }
          if (btn) btn.setAttribute("aria-label", dark ? "切换到浅色主题" : "切换到深色主题");
        }
        syncIcons();
        if (btn) {
          btn.addEventListener("click", function () {
            window.toggleTheme();
            syncIcons();
          });
        }
        var navBtn = document.getElementById("nav-toggle");
        var mobileNav = document.getElementById("mobile-nav");
        if (navBtn && mobileNav) {
          navBtn.addEventListener("click", function () {
            var open = mobileNav.classList.toggle("hidden") === false;
            navBtn.setAttribute("aria-expanded", open ? "true" : "false");
            navBtn.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
          });
        }
      })();
    </script>
  </body>
</html>
